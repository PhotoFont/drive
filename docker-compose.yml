version: '3.8'

services:
  filebrowser:
    image: filebrowser/filebrowser:v2.30.0
    container_name: filebrowser_app
    restart: unless-stopped
    ports:
      - "80"
    volumes:
      - filebrowser_data:/srv
      - filebrowser_db:/database
      - ./settings.json:/config/settings.json
    labels:
      - "coolify.managed=true"
      - "coolify.port=80"

volumes:
  filebrowser_data:
    driver: local
  filebrowser_db:
    driver: local